<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SPC Assessment™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#14151d;
    --ink-soft:#4a4d5c;
    --paper:#e8e3d3;
    --paper-2:#f4f1e6;
    --card:#fbf9f2;
    --brass:#a9793a;
    --brass-bright:#c79a54;
    --sage:#4f6b5a;
    --rose:#8a4a43;
    --line:rgba(20,21,29,0.14);
    --line-soft:rgba(20,21,29,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:56px 28px 90px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
    font-weight:600;
  }
  h1.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:38px;
    line-height:1.08;
    margin:10px 0 4px;
    letter-spacing:-0.01em;
  }
  h2.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    line-height:1.15;
    margin:0 0 6px;
  }
  .sub{
    font-size:15px;
    color:var(--ink-soft);
    margin:0 0 28px;
    line-height:1.55;
  }
  .rule{
    border:none;
    border-top:1px solid var(--line);
    margin:28px 0;
  }
  .seal{
    width:86px;height:86px;border-radius:50%;
    border:1.5px solid var(--brass);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:22px;
    color:var(--brass);
    margin:0 auto 22px;
    position:relative;
  }
  .seal::before{
    content:'';
    position:absolute; inset:6px;
    border:1px solid var(--brass-bright);
    border-radius:50%;
    opacity:0.5;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:32px;
  }
  .field{margin-bottom:20px;}
  label.flabel{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  input[type=text]{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:12px 14px;
    border:1px solid var(--line);
    background:var(--paper-2);
    border-radius:1px;
    color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--brass-bright); outline-offset:1px;}
  button{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-weight:600;
    cursor:pointer;
    border:none;
    transition:opacity .15s ease, transform .1s ease;
  }
  button:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-primary{
    background:var(--ink);
    color:var(--paper-2);
    padding:14px 26px;
    border-radius:1px;
  }
  .btn-primary:hover:not(:disabled){opacity:0.85;}
  .btn-primary:active:not(:disabled){transform:scale(0.98);}
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    padding:12px 18px;
    border:1px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .row-between{display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .progress-track{
    height:2px; background:var(--line); width:100%; margin:24px 0 34px; position:relative;
  }
  .progress-fill{height:2px; background:var(--brass); transition:width .25s ease;}
  .qnum{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; letter-spacing:0.08em; color:var(--brass); font-weight:600;
  }
  .qcomp{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);
    margin-bottom:14px;
  }
  .qtext{
    font-family:'Fraunces',serif; font-weight:500; font-size:23px; line-height:1.35;
    margin:6px 0 30px;
  }
  .scale{display:flex; flex-direction:column; gap:10px;}
  .scale-opt{
    display:flex; align-items:center; gap:14px;
    border:1px solid var(--line);
    padding:14px 16px;
    cursor:pointer;
    background:var(--paper-2);
    transition:border-color .12s ease, background .12s ease;
  }
  .scale-opt:hover{border-color:var(--brass-bright);}
  .scale-opt.selected{border-color:var(--brass); background:#f1e9d6;}
  .scale-num{
    width:28px;height:28px;border-radius:50%;
    border:1.5px solid var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600;
    flex-shrink:0;
  }
  .scale-opt.selected .scale-num{border-color:var(--brass); background:var(--brass); color:var(--paper-2);}
  .scale-label{font-size:15px;}
  .nav-row{display:flex; justify-content:space-between; margin-top:32px;}
  .loading-wrap{text-align:center; padding:80px 20px;}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--line);
    border-top-color:var(--brass);
    animation:spin 0.9s linear infinite;
    margin:0 auto 22px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-msg{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft);}
  /* report */
  .report-header{text-align:center; margin-bottom:40px;}
  .report-title{font-family:'Fraunces',serif; font-size:13px; letter-spacing:0.16em; text-transform:uppercase; color:var(--brass); font-weight:600;}
  .report-name{font-family:'Fraunces',serif; font-size:32px; font-weight:600; margin:8px 0 2px;}
  .report-meta{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); letter-spacing:0.05em;}
  .igpc-block{
    display:flex; align-items:center; gap:28px;
    padding:28px; background:var(--card); border:1px solid var(--line); margin:28px 0 8px;
  }
  .ring-wrap{position:relative; width:110px; height:110px; flex-shrink:0;}
  .ring-score{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-score .num{font-family:'Fraunces',serif; font-size:26px; font-weight:600;}
  .ring-score .den{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);}
  .igpc-label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--brass); margin-bottom:6px; font-weight:600;}
  .igpc-class{font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin-bottom:6px;}
  .section{margin:44px 0;}
  .section-num{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--brass); letter-spacing:0.1em; font-weight:600;}
  .section h2.display{margin-top:6px;}
  .comp-row{
    display:flex; align-items:center; gap:16px;
    padding:16px 0; border-bottom:1px solid var(--line-soft);
  }
  .comp-row:last-child{border-bottom:none;}
  .comp-bar-wrap{flex:1;}
  .comp-name{font-size:14.5px; font-weight:600; margin-bottom:6px;}
  .comp-track{height:6px; background:var(--line-soft); position:relative;}
  .comp-fill{height:6px; background:var(--brass);}
  .comp-score{font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; width:44px; text-align:right; flex-shrink:0;}
  .comp-class{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); width:150px; text-align:right; flex-shrink:0;}
  .comp-analysis{font-size:14px; color:var(--ink-soft); line-height:1.55; margin-top:8px;}
  ol.ranked, ul.plain{padding-left:0; list-style:none; margin:0;}
  ol.ranked li{
    display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--line-soft);
  }
  ol.ranked li:last-child{border-bottom:none;}
  .rank-idx{font-family:'IBM Plex Mono',monospace; color:var(--brass); font-weight:600; flex-shrink:0;}
  ul.bullets{padding-left:0; list-style:none;}
  ul.bullets li{
    padding:10px 0 10px 22px; position:relative; font-size:14.5px; line-height:1.55;
    border-bottom:1px solid var(--line-soft);
  }
  ul.bullets li:last-child{border-bottom:none;}
  ul.bullets li::before{content:'—'; position:absolute; left:0; color:var(--brass);}
  .profile-card{background:var(--card); border:1px solid var(--line); padding:26px;}
  .profile-name{font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin-bottom:10px; color:var(--brass);}
  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px;}
  .profile-grid .k{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:5px;}
  .profile-grid .v{font-size:13.5px; line-height:1.5;}
  .protocol-card{
    display:flex; gap:16px; padding:18px 0; border-bottom:1px solid var(--line-soft);
  }
  .protocol-card:last-child{border-bottom:none;}
  .protocol-idx{
    width:30px;height:30px;border-radius:50%;
    border:1.5px solid var(--brass); color:var(--brass);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; flex-shrink:0;
  }
  .protocol-name{font-weight:600; font-size:15px; margin-bottom:4px; font-family:'Fraunces',serif;}
  .protocol-just{font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .phase-card{background:var(--card); border:1px solid var(--line); padding:22px; margin-bottom:14px;}
  .phase-tag{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--brass); letter-spacing:0.08em; text-transform:uppercase; font-weight:600; margin-bottom:6px;}
  .phase-title{font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin-bottom:10px;}
  .conclusion-box{
    background:var(--ink); color:var(--paper-2); padding:30px; line-height:1.65; font-size:15px;
  }
  .conclusion-box .section-num{color:var(--brass-bright);}
  .footer-actions{display:flex; gap:12px; margin-top:44px; justify-content:center; flex-wrap:wrap;}
  .history-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 0; border-bottom:1px solid var(--line-soft); cursor:pointer;
  }
  .history-item:hover .hn{color:var(--brass);}
  .hn{font-weight:600; font-size:14.5px;}
  .hd{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);}
  @media print{
    body{background:white;}
    .footer-actions{display:none;}
  }
  @media (max-width:520px){
    .wrap{padding:36px 18px 70px;}
    h1.display{font-size:30px;}
    .qtext{font-size:19px;}
    .profile-grid{grid-template-columns:1fr;}
    .comp-class{display:none;}
  }

  /* ---- admin panel ---- */
  .wrap.admin-wrap{max-width:980px;}
  .admin-header{
    display:flex; justify-content:space-between; align-items:flex-end;
    padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:28px;
  }
  .admin-logo{font-family:'Fraunces',serif; font-weight:700; font-size:22px;}
  .admin-logo .accent{color:var(--brass);}
  .admin-sub{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px;}
  .admin-user{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); text-align:right;}
  .admin-user a{color:var(--ink); margin-left:10px;}
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:3px; padding:28px; margin-bottom:24px;
  }
  .panel-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--brass); font-weight:600; margin-bottom:8px;}
  .panel-head-row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; margin-bottom:6px;}
  .btn-pill{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.04em; font-weight:600;
    padding:11px 20px; border-radius:999px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink);
  }
  .btn-pill:hover{border-color:var(--ink-soft);}
  .btn-pill.dark{background:var(--ink); color:var(--paper-2); border-color:var(--ink);}
  .btn-pill.dark:hover{opacity:0.85;}
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  .stat-box{background:var(--paper-2); padding:18px 18px; border-radius:2px;}
  .stat-label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;}
  .stat-value{font-family:'Fraunces',serif; font-size:26px; font-weight:600;}
  .radar-wrap{display:flex; justify-content:center;}
  .radar-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; fill:var(--ink-soft);}
  .link-form{display:flex; gap:10px; margin-bottom:22px;}
  .link-form input{flex:1;}
  table.admin-table{width:100%; border-collapse:collapse;}
  table.admin-table th{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink-soft); text-align:left; padding:0 0 10px; border-bottom:1px solid var(--line); font-weight:600;
  }
  table.admin-table td{
    padding:13px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; vertical-align:middle;
  }
  table.admin-table td a.tlink{color:var(--ink); text-decoration:underline; cursor:pointer;}
  .status-pill{
    display:inline-block; padding:4px 12px; border-radius:999px; font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; font-weight:600; background:#e2e9e0; color:var(--sage);
  }
  .status-pill.off{background:#eee; color:var(--ink-soft);}
  .class-pill{
    display:inline-block; padding:6px 14px; border-radius:999px; font-family:'Fraunces',serif; font-weight:600; font-size:12.5px;
    color:var(--paper-2); background:var(--ink);
  }
  .class-pill.elite,.class-pill.alta{background:#1f3327; color:#eaf2ea;}
  .class-pill.consistente{background:#5b5540; color:#f3efdd;}
  .class-pill.moderado,.class-pill.desenvolvimento{background:#d8cfab; color:#4a3f22;}
  .class-pill.prioritaria{background:#5c2b27; color:#f6e2df;}
  .admin-search{width:280px;}
  .empty-note{font-size:13.5px; color:var(--ink-soft); padding:10px 0;}
  .auth-box{max-width:360px; margin:80px auto 0;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const COMPETENCIES = [
  { key:'mentalidade',  nome:'Mentalidade Comercial' },
  { key:'comunicacao',  nome:'Comunicação Persuasiva' },
  { key:'conversao',    nome:'Conversão Comercial' },
  { key:'prospeccao',   nome:'Prospecção Inteligente' },
  { key:'atendimento',  nome:'Excelência no Atendimento' },
  { key:'performance',  nome:'Alta Performance Comercial' },
];

const PROTOCOLS = [
  'Protocolo da Mentalidade Comercial™',
  'Protocolo da Comunicação Persuasiva™',
  'Protocolo da Conversão Comercial™',
  'Protocolo da Prospecção Inteligente™',
  'Protocolo da Excelência no Atendimento™',
  'Protocolo da Alta Performance Comercial™',
];

const QUESTIONS = [
  "Assumo total responsabilidade pelos meus resultados comerciais.",
  "Continuo prospectando mesmo depois de receber respostas negativas.",
  "Vejo a atividade de vendas como uma oportunidade de gerar valor para as pessoas.",
  "Executo minhas atividades comerciais mesmo quando não estou motivado.",
  "Acredito que meus resultados dependem mais das minhas ações do que das circunstâncias.",
  "Encaro objeções como oportunidades para compreender melhor o cliente.",
  "Busco melhorar continuamente minha performance comercial.",
  "Mantenho uma postura profissional e confiante durante todas as atividades comerciais.",
  "Ouço atentamente o cliente antes de apresentar qualquer solução.",
  "Faço perguntas para compreender profundamente as necessidades do cliente.",
  "Explico minhas soluções de forma simples, clara e objetiva.",
  "Adapto minha comunicação ao perfil de cada cliente.",

  "Apresento benefícios que fazem sentido para a realidade de cada cliente.",
  "Construo valor antes de apresentar o preço.",

  "Sigo um processo comercial estruturado em praticamente todas as minhas vendas.",
  "Realizo prospecção de novos clientes todos os dias.",
  "Mantenho uma meta diária de novos contatos comerciais.",
  "Faço acompanhamento (follow-up) das oportunidades que ainda não foram concluídas.",
  "Mantenho meu pipeline ou lista de oportunidades sempre atualizado.",
  "Solicito indicações para clientes satisfeitos de forma consistente.",
  "Busco continuamente novas fontes para gerar oportunidades comerciais.",
  "Organizo e acompanho meus contatos utilizando um sistema, CRM ou planilha.",
  "Mesmo quando tenho boas vendas, continuo prospectando novos clientes.",
  "Procuro oferecer uma experiência que supere as expectativas dos meus clientes.",
  "Faço acompanhamento dos clientes após a venda para verificar sua satisfação.",
  "Cumpro rigorosamente os prazos e compromissos assumidos com meus clientes.",
  "Quando surge um problema, assumo a responsabilidade até que ele seja resolvido.",
  "Personalizo meu atendimento de acordo com as necessidades de cada cliente.",
  "Peço feedback aos clientes para identificar oportunidades de melhoria.",
  "Recebo indicações de novos clientes como resultado da qualidade do meu atendimento.",
  "Mantenho relacionamento com meus clientes mesmo quando não há uma venda em andamento.",
  "Planejo meu dia antes de iniciar minhas atividades comerciais.",
  "Executo primeiro as atividades que geram maior impacto nos meus resultados.",
  "Acompanho diariamente meus principais indicadores comerciais.",
  "Mantenho foco nas minhas atividades, evitando distrações durante o trabalho.",
  "Reviso meus resultados e identifico oportunidades de melhoria com frequência.",
  "Cumpro minha rotina comercial mesmo quando surgem imprevistos.",
  "Busco melhorar continuamente meus processos e minha produtividade.",
  "Mantenho disciplina e constância na execução das minhas atividades comerciais ao longo do tempo.",
].map((text, i) => ({ id:i, compIndex: Math.floor(i/8), text }));

const SCALE = [
  {v:1, label:'Nunca'},
  {v:2, label:'Raramente'},
  {v:3, label:'Às vezes'},
  {v:4, label:'Frequentemente'},
  {v:5, label:'Sempre'},
];

function classify(avg){
  if(avg>=4.5) return 'Elite Comercial™';
  if(avg>=4.0) return 'Alta Performance™';
  if(avg>=3.5) return 'Performance Consistente™';
  if(avg>=3.0) return 'Em Desenvolvimento™';
  if(avg>=2.0) return 'Necessita Desenvolvimento™';
  return 'Intervenção Prioritária™';
}

const ADMIN_PASSCODE = 'gm2026';

let state = {
  screen: 'start',
  clientName: '',
  city: '',
  qIndex: 0,
  answers: {},
  report: null,
  scores: null,
  historyList: [],
  startTime: null,
  urlLinkId: new URLSearchParams(location.search).get('src') || null,
  adminAuthed: false,
  assessmentsAll: [],
  linksAll: [],
  cameFromAdmin: false,
};

const app = document.getElementById('app');

function render(){
  app.classList.toggle('admin-wrap', state.screen==='admin');
  if(state.screen==='start') return renderStart();
  if(state.screen==='quiz') return renderQuiz();
  if(state.screen==='loading') return renderLoading();
  if(state.screen==='report') return renderReport();
  if(state.screen==='history') return renderHistory();
  if(state.screen==='adminAuth') return renderAdminAuth();
  if(state.screen==='admin') return renderAdmin();
}

function renderStart(){
  app.innerHTML = `
    <div class="seal">SPC</div>
    <div style="text-align:center;">
      <div class="eyebrow">Método Garcia Marques™</div>
      <h1 class="display">SPC Assessment™</h1>
      <p class="sub">Sistema de Performance Comercial · avaliação das 6 competências que definem alta performance em vendas.</p>
    </div>
    <div class="card">
      <div class="field">
        <label class="flabel">Nome do cliente / participante</label>
        <input type="text" id="clientNameInput" placeholder="Ex.: Ana Beatriz Souza" value="${escapeHtml(state.clientName)}" />
      </div>

function computeScores(){
  const compTotals = COMPETENCIES.map(()=>({sum:0,count:0}));
  QUESTIONS.forEach(q=>{
    const val = state.answers[q.id];
    compTotals[q.compIndex].sum += val;
    compTotals[q.compIndex].count += 1;
  });
  const compScores = compTotals.map((t,i)=>({
    key: COMPETENCIES[i].key,
    nome: COMPETENCIES[i].nome,
    avg: t.sum / t.count,
  }));
  const overall = compScores.reduce((a,c)=>a+c.avg,0) / compScores.length;
  return { compScores, overall };
}

async function finishQuiz(){
  state.scores = computeScores();

function ring(pct, size=110){
  const r = (size-14)/2;

        stroke-dasharray="${dash} ${c}" stroke-linecap="round"
        transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>
  `;
}

async function saveAssessment(){
  try{
    const durationMin = state.startTime ? Math.max(1, Math.round((Date.now()-state.startTime)/60000)) : null;
    const id = 'assessment:' + Date.now() + '-' + state.clientName.replace(/\s+/g,'_').toLowerCase();
    await window.storage.set(id, JSON.stringify({
      clientName: state.clientName,
      city: state.city || '',
      date: new Date().toISOString(),
      overall: state.scores.overall,
      overallClass: classify(state.scores.overall),
      compScores: state.scores.compScores,
      report: state.report,
      durationMin: durationMin,
      linkId: state.urlLinkId || null,
    }), true);
  }catch(e){
    console.error('Falha ao salvar avaliação', e);
  }
  if(state.urlLinkId){
    try{
      const key = 'link:' + state.urlLinkId;
      const res = await window.storage.get(key, true);
      if(res){
        const data = JSON.parse(res.value);
        data.uses = (data.uses||0) + 1;
        await window.storage.set(key, JSON.stringify(data), true);
      }
    }catch(e){
      console.error('Falha ao atualizar uso do link', e);
    }
  }
}

async function loadAdminData(){
  try{
    const listRes = await window.storage.list('assessment:', true);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    const items = [];
    for(const k of keys){
      try{
        const res = await window.storage.get(k, true);
        if(res) items.push({ key:k, data: JSON.parse(res.value) });
      }catch(e){}
    }
    items.sort((a,b)=> new Date(b.data.date) - new Date(a.data.date));
    state.assessmentsAll = items;
  }catch(e){ state.assessmentsAll = []; }

  try{
    const linkRes = await window.storage.list('link:', true);
    const keys = (linkRes && linkRes.keys) ? linkRes.keys : [];
    const items = [];
    for(const k of keys){
      try{
        const res = await window.storage.get(k, true);
        if(res) items.push({ key:k, id:k.replace('link:',''), data: JSON.parse(res.value) });
      }catch(e){}

function classSlug(label){
  const l = label.toLowerCase();
  if(l.includes('elite')) return 'elite';
  if(l.includes('alta')) return 'alta';
  if(l.includes('consistente')) return 'consistente';
  if(l.includes('em desenvolvimento')) return 'desenvolvimento';
  if(l.includes('necessita')) return 'moderado';
  if(l.includes('intervenção')) return 'prioritaria';
  return '';
}

function radarSVG(values){
  const size = 380, cx = size/2, cy = size/2, maxR = 145;
  const n = COMPETENCIES.length;
  const points = values.map((v,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const r = (v/5)*maxR;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  });
  const poly = points.map(p=>p.join(',')).join(' ');
  const rings = [0.25,0.5,0.75,1].map(f=>{
    const rp = [];
    for(let i=0;i<n;i++){
      const angle = (Math.PI*2*i/n) - Math.PI/2;
      rp.push([cx + maxR*f*Math.cos(angle), cy + maxR*f*Math.sin(angle)]);
    }
    return `<polygon points="${rp.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');
  const spokes = COMPETENCIES.map((c,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const x2 = cx + maxR*Math.cos(angle), y2 = cy + maxR*Math.sin(angle);
    const lx = cx + (maxR+34)*Math.cos(angle), ly = cy + (maxR+34)*Math.sin(angle);
    const anchor = Math.cos(angle) > 0.3 ? 'start' : (Math.cos(angle) < -0.3 ? 'end' : 'middle');
    return `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--line)" stroke-width="1"/>
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" class="radar-label" dominant-baseline="middle">${escapeHtml(c.nome)}</text>`;
  }).join('');
  return `<svg width="${size}" height="${size+20}" viewBox="0 0 ${size} ${size+20}">
    ${rings}${spokes}
    <polygon points="${poly}" fill="var(--sage)" fill-opacity="0.28" stroke="var(--sage)" stroke-width="2"/>
    ${points.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--sage)"/>`).join('')}
  </svg>`;
}

  const clientesUnicos = new Set(all.map(it=>it.data.clientName)).size;

  const radarAvgs = COMPETENCIES.map(c=>{
    if(n===0) return 0;
    const vals = all.map(it => (it.data.compScores.find(cs=>cs.key===c.key)||{avg:0}).avg);
    return vals.reduce((a,b)=>a+b,0)/vals.length;
  });

  const filtered = state._searchQuery
    ? all.filter(it => (it.data.clientName+' '+(it.data.city||'')).toLowerCase().includes(state._searchQuery.toLowerCase()))
    : all;

  app.innerHTML = `
    <div class="admin-header">
      <div>
        <div class="admin-logo">SPC <span class="accent">Assessment™</span></div>
        <div class="admin-sub">Instrumento Digital · Método Garcia Marques™</div>
      </div>
      <div class="admin-user">Administrador <a href="#" id="sairLink">Sair</a></div>
    </div>

    <div class="panel">
      <div class="panel-head-row">
        <div>
          <div class="panel-eyebrow">Painel administrativo · Método Garcia Marques™</div>
          <h2 class="display" style="margin:0;">Visão geral</h2>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn-pill" id="mgFacBtn">Gerenciar Facilitadores</button>
          <button class="btn-pill dark" id="novaAvBtn">Nova avaliação →</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-label">Participantes</div><div class="stat-value">${clientesUnicos}</div></div>
        <div class="stat-box"><div class="stat-label">Facilitadores</div><div class="stat-value">1</div></div>
        <div class="stat-box"><div class="stat-label">Avaliações</div><div class="stat-value">${n}</div></div>
        <div class="stat-box"><div class="stat-label">Tempo médio</div><div class="stat-value">${avgTime ? avgTime+' min' : '—'}</div></div>
        <div class="stat-box"><div class="stat-label">Hoje</div><div class="stat-value">${todayCount}</div></div>
        <div class="stat-box"><div class="stat-label">Este mês</div><div class="stat-value">${monthCount}</div></div>
        <div class="stat-box"><div class="stat-label">IGPC™ médio</div><div class="stat-value">${n ? avgIGPC.toFixed(2) : '—'}</div></div>
        <div class="stat-box"><div class="stat-label">% Alta Performance+</div><div class="stat-value">${n ? pctAltaOuMais+'%' : '—'}</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-eyebrow">Radar médio geral</div>
      <h2 class="display">As 6 competências (todas as avaliações)</h2>
      ${n===0 ? `<p class="empty-note">Ainda não há avaliações suficientes para gerar o radar.</p>` : `<div class="radar-wrap">${radarSVG(radarAvgs)}</div>`}
    </div>

    <div class="panel">
      <div class="panel-eyebrow">Meus links de avaliação</div>
      <h2 class="display">Enviar para participantes</h2>
      <p class="sub" style="margin-bottom:22px;">Gere um link único e envie por WhatsApp, e-mail etc. O participante preenche sem precisar de login — a avaliação chega vinculada a você.</p>
      <div class="link-form">
        <input type="text" id="linkNameInput" placeholder="Nome do link (ex.: Turma Julho 2026)" />
        <button class="btn-pill dark" id="genLinkBtn" style="white-space:nowrap;">+ Gerar link</button>
      </div>
      <table class="admin-table">
        <thead><tr><th>Nome</th><th>Usos</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${state.linksAll.length===0 ? `<tr><td colspan="4" class="empty-note">Nenhum link gerado ainda.</td></tr>` :
            state.linksAll.map(l=>`
              <tr>
                <td>${escapeHtml(l.data.name || 'Sem nome')}</td>
                <td>${l.data.uses||0}</td>
                <td><span class="status-pill ${l.data.active===false?'off':''}">${l.data.active===false?'Inativo':'Ativo'}</span></td>
                <td style="text-align:right;">
                  <a class="tlink" data-id="${l.id}" data-action="copy">Copiar link</a>
                  &nbsp;&nbsp;
                  <a class="tlink" data-id="${l.id}" data-action="toggle">${l.data.active===false?'Ativar':'Desativar'}</a>
                </td>
              </tr>
            `).join('')
          }
        </tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-eyebrow">Facilitadores</div>
      <h2 class="display">Ranking por volume de avaliações</h2>
      <table class="admin-table">
        <thead><tr><th>Facilitador</th><th>Clientes</th><th>Avaliações</th><th>IGPC™ médio</th><th>Última avaliação</th></tr></thead>
        <tbody>
          <tr>
            <td>Você</td>
            <td>${clientesUnicos}</td>
            <td>${n}</td>
            <td>${n ? avgIGPC.toFixed(2) : '—'}</td>
            <td>${n ? new Date(all[0].data.date).toLocaleDateString('pt-BR') : '—'}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-eyebrow">Todas as avaliações</div>
      <div class="panel-head-row">
        <h2 class="display" style="margin:0;">Histórico completo</h2>
        <div style="display:flex; gap:10px;">
          <button class="btn-pill" id="exportCsvBtn">Exportar CSV</button>
          <button class="btn-pill" id="exportXlsBtn">Exportar Excel</button>
        </div>
      </div>
      <input type="text" class="admin-search" id="searchInput" placeholder="Buscar por nome, cidade..." style="margin:18px 0 4px; padding:10px 12px; border:1px solid var(--line); background:var(--paper-2); font-family:'Inter',sans-serif; font-size:14px;" value="${escapeHtml(state._searchQuery||'')}"/>
      <table class="admin-table">
        <thead><tr><th>Participante</th><th>Data</th><th>IGPC™</th><th>Classificação</th><th>Perfil</th><th>Local</th><th></th></tr></thead>
        <tbody>
          ${filtered.length===0 ? `<tr><td colspan="7" class="empty-note">Nenhuma avaliação encontrada.</td></tr>` :
            filtered.map((it,i)=>`
              <tr>
                <td>${escapeHtml(it.data.clientName)}</td>
                <td>${new Date(it.data.date).toLocaleDateString('pt-BR')} ${new Date(it.data.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td>
                <td>${it.data.overall.toFixed(2)}</td>
                <td><span class="class-pill ${classSlug(it.data.overallClass)}">${escapeHtml(it.data.overallClass)}</span></td>
                <td>${escapeHtml(it.data.report && it.data.report.perfil_comercial ? it.data.report.perfil_comercial.nome : '—')}</td>
                <td>${escapeHtml(it.data.city || '—')}</td>
                <td style="text-align:right;"><a class="tlink" data-idx="${i}" data-action="view">Ver relatório</a></td>
              </tr>
            `).join('')
          }
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('sairLink').addEventListener('click', e=>{
    e.preventDefault();
    state.adminAuthed = false;
    state.screen = 'start';
    render();
  });
  document.getElementById('mgFacBtn').addEventListener('click', ()=>{
    alert('Gestão de múltiplos facilitadores é um recurso futuro. Por enquanto, este painel opera com um único facilitador (você).');
  });
  document.getElementById('novaAvBtn').addEventListener('click', ()=>{
    state.clientName=''; state.city=''; state.qIndex=0; state.answers={}; state.urlLinkId=null;
    state.screen='start'; render();
  });
  document.getElementById('genLinkBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('linkNameInput').value.trim();
    const id = 'l' + Date.now().toString(36);
    try{
      await window.storage.set('link:'+id, JSON.stringify({ name: name || 'Sem nome', uses:0, active:true, createdAt: new Date().toISOString() }), true);
      await loadAdminData();
      render();
    }catch(e){ alert('Não foi possível gerar o link.'); }
  });
  document.getElementById('searchInput').addEventListener('input', e=>{
    state._searchQuery = e.target.value;
    render();
    document.getElementById('searchInput').focus();
    const v = document.getElementById('searchInput').value;
    document.getElementById('searchInput').setSelectionRange(v.length, v.length);
  });
  document.getElementById('exportCsvBtn').addEventListener('click', ()=>exportHistory('csv'));
  document.getElementById('exportXlsBtn').addEventListener('click', ()=>exportHistory('xlsx'));

  document.querySelectorAll('a.tlink[data-action="copy"]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.preventDefault();
      const url = location.origin + location.pathname + '?src=' + el.dataset.id;
      navigator.clipboard.writeText(url).then(()=>{
        el.textContent = 'Copiado!';
        setTimeout(()=>{ el.textContent = 'Copiar link'; }, 1500);
      }).catch(()=>{ prompt('Copie o link abaixo:', url); });
    });
  });
  document.querySelectorAll('a.tlink[data-action="toggle"]').forEach(el=>{
    el.addEventListener('click', async e=>{
      e.preventDefault();
      const link = state.linksAll.find(l=>l.id===el.dataset.id);
      if(!link) return;
      link.data.active = link.data.active===false ? true : false;
      await window.storage.set('link:'+link.id, JSON.stringify(link.data), true);
      render();
    });
  });
  document.querySelectorAll('a.tlink[data-action="view"]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.preventDefault();
      const it = filtered[parseInt(el.dataset.idx,10)];
      state.clientName = it.data.clientName;
      state.scores = { compScores: it.data.compScores, overall: it.data.overall };
      state.report = it.data.report;
      state.cameFromAdmin = true;
      state.screen = 'report';
      render();
    });
  });
}

function exportHistory(kind){
  const rows = state.assessmentsAll.map(it=>({
    Participante: it.data.clientName,
    Data: new Date(it.data.date).toLocaleString('pt-BR'),
    'IGPC': it.data.overall.toFixed(2),
    Classificação: it.data.overallClass,
    Perfil: it.data.report && it.data.report.perfil_comercial ? it.data.report.perfil_comercial.nome : '',
    Local: it.data.city || '',
  }));
  if(kind==='csv'){
    const header = Object.keys(rows[0]||{Participante:'',Data:'',IGPC:'',Classificação:'',Perfil:'',Local:''});
    const csv = [header.join(';'), ...rows.map(r=>header.map(h=>`"${String(r[h]||'').replace(/"/g,'""')}"`).join(';'))].join('\n');
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'historico_spc_assessment.csv';
    a.click();
  } else {
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Histórico');
    XLSX.writeFile(wb, 'historico_spc_assessment.xlsx');
  }
}

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

render();
</script>
</body>
</html>
